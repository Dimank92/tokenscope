[package]
name = "tokenscope-executor"
description = "Real SVM execution of Token-2022 setup and target programs (Mollusk-based)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mollusk-svm = "=0.16.2"
mollusk-svm-programs-token-2022 = { version = "=0.16.2", features = ["extensions"] }
solana-account = "4.3"
solana-instruction = "3.2"
solana-pubkey = "4.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
spl-token-2022-interface = "=3.1.2"
sha2.workspace = true
thiserror.workspace = true
tokenscope-model = { path = "../tokenscope-model" }

[lints]
workspace = true
