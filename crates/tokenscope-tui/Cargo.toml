[package]
name = "tokenscope-tui"
description = "Interactive terminal UI over real TokenScope engine state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ratatui = "0.30"
tokenscope-core = { path = "../tokenscope-core" }
tokenscope-invariants = { path = "../tokenscope-invariants" }
tokenscope-model = { path = "../tokenscope-model" }
tokenscope-report = { path = "../tokenscope-report" }
tokenscope-scenarios = { path = "../tokenscope-scenarios" }

# Already in the tree via crossterm; used to leave the event loop (and so restore the terminal)
# on SIGTERM/SIGHUP.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[features]
# Test-only hook: with TOKENSCOPE_TUI_FAULT=panic|error the event loop fails on its 3rd frame so
# terminal restoration can be verified. Not enabled in default builds.
fault-injection = []

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
