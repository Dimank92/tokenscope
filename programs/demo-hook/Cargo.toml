[package]
name = "demo-hook"
description = "Demo Token-2022 transfer-hook program for TokenScope tests (counter + reject flag)"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pinocchio = { version = "=0.11.2", features = ["cpi"] }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
