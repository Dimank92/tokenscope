<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b1b24" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#9945FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="#0A0F1D" />
  <rect width="1196" height="296" x="2" y="2" rx="14" stroke="url(#solanaGrad)" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="160" cy="150" r="140" fill="url(#glow)" />
  <circle cx="1080" cy="150" r="180" fill="url(#glow)" opacity="0.4" />

  <!-- Radar Emblem Left -->
  <g transform="translate(160, 150)">
    <circle r="95" stroke="#9945FF" stroke-width="1.8" stroke-dasharray="4 6" stroke-opacity="0.5" />
    <circle r="78" stroke="#14F195" stroke-width="1.8" stroke-opacity="0.4" />
    <circle r="56" stroke="#00C2FF" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.6" />

    <!-- Ticks -->
    <line x1="-110" y1="0" x2="-88" y2="0" stroke="#14F195" stroke-width="2.5" />
    <line x1="88" y1="0" x2="110" y2="0" stroke="#14F195" stroke-width="2.5" />
    <line x1="0" y1="-110" x2="0" y2="-88" stroke="#14F195" stroke-width="2.5" />
    <line x1="0" y1="88" x2="0" y2="110" stroke="#14F195" stroke-width="2.5" />

    <!-- Shield & Delta -->
    <polygon points="0,-42 34,-21 34,18 0,42 -34,18 -34,-21" fill="url(#shieldGrad)" stroke="url(#solanaGrad)" stroke-width="2.2" filter="url(#neonBlur)" />
    <path d="M0 -18 L16 12 L-16 12 Z" fill="none" stroke="#14F195" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="4" fill="#9945FF" />
  </g>

  <!-- Title & Typography Center/Right -->
  <g transform="translate(310, 0)">
    <!-- Main Title -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="url(#textGrad)">TokenScope</text>
    
    <!-- Version Tag -->
    <rect x="375" y="72" width="70" height="26" rx="13" fill="#1e1035" stroke="#9945FF" stroke-width="1.2" />
    <text x="410" y="89" font-family="monospace" font-size="13" font-weight="bold" fill="#14F195" text-anchor="middle">v0.1.0</text>

    <!-- Subtitle -->
    <text x="2" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#94A3B8">ADVERSARIAL INVARIANT VERIFICATION &amp; FUZZING</text>
    
    <!-- Description -->
    <text x="2" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B">Zero-mock in-process Mollusk SVM testing for Solana Token-2022 integrations</text>

    <!-- Badges / Pillars -->
    <g transform="translate(2, 214)">
      <rect width="132" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="3.5" fill="#14F195" />
      <text x="24" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#CBD5E1">MOLLUSK SVM</text>

      <rect x="144" width="136" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="156" cy="13" r="3.5" fill="#9945FF" />
      <text x="168" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#CBD5E1">TOKEN-2022</text>

      <rect x="292" width="138" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="304" cy="13" r="3.5" fill="#00C2FF" />
      <text x="316" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#CBD5E1">PINOCCHIO SBF</text>

      <rect x="442" width="124" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="454" cy="13" r="3.5" fill="#F59E0B" />
      <text x="466" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#CBD5E1">SARIF 2.1.0</text>
    </g>
  </g>
</svg>