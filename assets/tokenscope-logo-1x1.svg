<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b1b24" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#9945FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0A0F1D" />
  <rect width="508" height="508" x="2" y="2" rx="94" stroke="url(#solanaGrad)" stroke-width="2.5" stroke-opacity="0.4" />
  <circle cx="256" cy="220" r="210" fill="url(#glow)" />

  <!-- Radar / Scope Crosshairs -->
  <g transform="translate(256, 220)">
    <!-- Outer Scope Rings -->
    <circle r="145" stroke="#9945FF" stroke-width="2.5" stroke-dasharray="6 8" stroke-opacity="0.5" />
    <circle r="120" stroke="#14F195" stroke-width="2.5" stroke-opacity="0.45" />
    <circle r="85" stroke="#00C2FF" stroke-width="2" stroke-dasharray="3 6" stroke-opacity="0.65" />

    <!-- Crosshair Ticks -->
    <line x1="-165" y1="0" x2="-130" y2="0" stroke="#14F195" stroke-width="3" />
    <line x1="130" y1="0" x2="165" y2="0" stroke="#14F195" stroke-width="3" />
    <line x1="0" y1="-165" x2="0" y2="-130" stroke="#14F195" stroke-width="3" />
    <line x1="0" y1="130" x2="0" y2="165" stroke="#14F195" stroke-width="3" />

    <!-- Center Crosshairs -->
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#14F195" stroke-width="2" stroke-opacity="0.8" />
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#14F195" stroke-width="2" stroke-opacity="0.8" />

    <!-- Central Verification Shield -->
    <polygon points="0,-65 52,-32 52,28 0,65 -52,28 -52,-32" fill="url(#shieldGrad)" stroke="url(#solanaGrad)" stroke-width="3" filter="url(#neonBlur)" />
    
    <!-- Token-2022 Delta Invariant Symbol -->
    <path d="M0 -28 L24 20 L-24 20 Z" fill="none" stroke="#14F195" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="6" fill="#9945FF" />
  </g>

  <!-- Typography -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)" text-anchor="middle">TokenScope</text>
  
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2" fill="#94A3B8" text-anchor="middle">SOLANA TOKEN-2022 FUZZER</text>
</svg>