<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b1b24" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#9945FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="220" rx="16" fill="#0A0F1D" />
  <rect width="878" height="218" x="1" y="1" rx="15" stroke="url(#solanaGrad)" stroke-width="1.2" stroke-opacity="0.3" />
  <circle cx="110" cy="110" r="100" fill="url(#glow)" />

  <!-- Radar / Scope Crosshairs -->
  <g transform="translate(110, 110)">
    <!-- Outer Scope Ring -->
    <circle r="72" stroke="#9945FF" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.5" />
    <circle r="60" stroke="#14F195" stroke-width="1.5" stroke-opacity="0.4" />
    <circle r="42" stroke="#00C2FF" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.6" />

    <!-- Crosshair Ticks -->
    <line x1="-80" y1="0" x2="-64" y2="0" stroke="#14F195" stroke-width="2" />
    <line x1="64" y1="0" x2="80" y2="0" stroke="#14F195" stroke-width="2" />
    <line x1="0" y1="-80" x2="0" y2="-64" stroke="#14F195" stroke-width="2" />
    <line x1="0" y1="64" x2="0" y2="80" stroke="#14F195" stroke-width="2" />

    <!-- Center Crosshairs -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#14F195" stroke-width="1" stroke-opacity="0.8" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#14F195" stroke-width="1" stroke-opacity="0.8" />

    <!-- Central Verification Shield -->
    <polygon points="0,-32 26,-16 26,14 0,32 -26,14 -26,-16" fill="url(#shieldGrad)" stroke="url(#solanaGrad)" stroke-width="2" filter="url(#neonBlur)" />
    
    <!-- Token-2022 Delta Invariant Symbol -->
    <path d="M0 -14 L12 10 L-12 10 Z" fill="none" stroke="#14F195" stroke-width="2" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="3" fill="#9945FF" />
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="220" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)">TokenScope</text>
  
  <!-- Version Tag -->
  <rect x="525" y="60" width="62" height="24" rx="12" fill="#1e1035" stroke="#9945FF" stroke-width="1" />
  <text x="556" y="76" font-family="monospace" font-size="12" font-weight="bold" fill="#14F195" text-anchor="middle">v0.1.0</text>

  <!-- Subtitle -->
  <text x="222" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#94A3B8">ADVERSARIAL INVARIANT VERIFICATION &amp; FUZZING</text>
  
  <!-- Target Platform Info -->
  <text x="222" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Engineered for Solana Token-2022 on in-process Mollusk SVM</text>

  <!-- Spec Badges Pill in SVG -->
  <g transform="translate(222, 172)">
    <rect width="108" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#14F195" />
    <text x="20" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#CBD5E1">252 TESTS</text>

    <rect x="116" width="138" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="126" cy="11" r="3.5" fill="#9945FF" />
    <text x="136" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#CBD5E1">MOLLUSK SVM</text>

    <rect x="262" width="124" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="272" cy="11" r="3.5" fill="#00C2FF" />
    <text x="282" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#CBD5E1">SARIF 2.1.0</text>

    <rect x="394" width="144" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="404" cy="11" r="3.5" fill="#F59E0B" />
    <text x="414" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#CBD5E1">2,000+ TX/SEC</text>
  </g>
</svg>
