<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="190" fill="none">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b1b24" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#9945FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="190" rx="16" fill="#0A0F1D" />
  <rect width="878" height="188" x="1" y="1" rx="15" stroke="url(#solanaGrad)" stroke-width="1.2" stroke-opacity="0.3" />
  <circle cx="110" cy="95" r="95" fill="url(#glow)" />

  <!-- Radar / Scope Crosshairs -->
  <g transform="translate(110, 95)">
    <!-- Outer Scope Ring -->
    <circle r="68" stroke="#9945FF" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.5" />
    <circle r="56" stroke="#14F195" stroke-width="1.5" stroke-opacity="0.4" />
    <circle r="40" stroke="#00C2FF" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.6" />

    <!-- Crosshair Ticks -->
    <line x1="-76" y1="0" x2="-60" y2="0" stroke="#14F195" stroke-width="2" />
    <line x1="60" y1="0" x2="76" y2="0" stroke="#14F195" stroke-width="2" />
    <line x1="0" y1="-76" x2="0" y2="-60" stroke="#14F195" stroke-width="2" />
    <line x1="0" y1="60" x2="0" y2="76" stroke="#14F195" stroke-width="2" />

    <!-- Center Crosshairs -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#14F195" stroke-width="1" stroke-opacity="0.8" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#14F195" stroke-width="1" stroke-opacity="0.8" />

    <!-- Central Verification Shield -->
    <polygon points="0,-30 24,-15 24,13 0,30 -24,13 -24,-15" fill="url(#shieldGrad)" stroke="url(#solanaGrad)" stroke-width="2" filter="url(#neonBlur)" />
    
    <!-- Token-2022 Delta Invariant Symbol -->
    <path d="M0 -13 L11 9 L-11 9 Z" fill="none" stroke="#14F195" stroke-width="2" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="3" fill="#9945FF" />
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="220" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)">TokenScope</text>
  
  <!-- Version Tag -->
  <rect x="520" y="54" width="62" height="24" rx="12" fill="#1e1035" stroke="#9945FF" stroke-width="1" />
  <text x="551" y="70" font-family="monospace" font-size="12" font-weight="bold" fill="#14F195" text-anchor="middle">v0.1.0</text>

  <!-- Subtitle -->
  <text x="222" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#94A3B8">ADVERSARIAL INVARIANT VERIFICATION &amp; FUZZING</text>
  
  <!-- Target Platform Info -->
  <text x="222" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Engineered for Solana Token-2022 on in-process Mollusk SVM</text>
</svg>
