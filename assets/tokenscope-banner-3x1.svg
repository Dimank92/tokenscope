<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b1b24" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#9945FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="#0A0F1D" />
  <rect width="1196" height="396" x="2" y="2" rx="18" stroke="url(#solanaGrad)" stroke-width="1.8" stroke-opacity="0.35" />
  <circle cx="200" cy="200" r="180" fill="url(#glow)" />
  <circle cx="1060" cy="200" r="220" fill="url(#glow)" opacity="0.3" />

  <!-- Radar Emblem Left -->
  <g transform="translate(200, 200)">
    <circle r="125" stroke="#9945FF" stroke-width="2" stroke-dasharray="5 7" stroke-opacity="0.5" />
    <circle r="102" stroke="#14F195" stroke-width="2" stroke-opacity="0.4" />
    <circle r="72" stroke="#00C2FF" stroke-width="1.8" stroke-dasharray="3 5" stroke-opacity="0.6" />

    <!-- Ticks -->
    <line x1="-145" y1="0" x2="-115" y2="0" stroke="#14F195" stroke-width="3" />
    <line x1="115" y1="0" x2="145" y2="0" stroke="#14F195" stroke-width="3" />
    <line x1="0" y1="-145" x2="0" y2="-115" stroke="#14F195" stroke-width="3" />
    <line x1="0" y1="115" x2="0" y2="145" stroke="#14F195" stroke-width="3" />

    <!-- Shield & Delta -->
    <polygon points="0,-55 44,-27 44,24 0,55 -44,24 -44,-27" fill="url(#shieldGrad)" stroke="url(#solanaGrad)" stroke-width="2.6" filter="url(#neonBlur)" />
    <path d="M0 -24 L20 16 L-20 16 Z" fill="none" stroke="#14F195" stroke-width="3" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="5" fill="#9945FF" />
  </g>

  <!-- Title & Typography Center/Right -->
  <g transform="translate(380, 0)">
    <!-- Main Title -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-1.5" fill="url(#textGrad)">TokenScope</text>
    
    <!-- Version Tag -->
    <rect x="430" y="104" width="76" height="28" rx="14" fill="#1e1035" stroke="#9945FF" stroke-width="1.4" />
    <text x="468" y="123" font-family="monospace" font-size="14" font-weight="bold" fill="#14F195" text-anchor="middle">v0.1.0</text>

    <!-- Subtitle -->
    <text x="2" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#94A3B8">ADVERSARIAL INVARIANT VERIFICATION &amp; FUZZING</text>
    
    <!-- Description -->
    <text x="2" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B">Zero-mock in-process Mollusk SVM testing for Solana Token-2022 integrations</text>

    <!-- Badges / Pillars -->
    <g transform="translate(2, 275)">
      <rect width="144" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="16" r="4" fill="#14F195" />
      <text x="28" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#CBD5E1">MOLLUSK SVM</text>

      <rect x="158" width="148" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="172" cy="16" r="4" fill="#9945FF" />
      <text x="186" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#CBD5E1">TOKEN-2022</text>

      <rect x="320" width="150" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="334" cy="16" r="4" fill="#00C2FF" />
      <text x="348" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#CBD5E1">PINOCCHIO SBF</text>

      <rect x="484" width="138" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="498" cy="16" r="4" fill="#F59E0B" />
      <text x="512" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#CBD5E1">SARIF 2.1.0</text>
    </g>
  </g>
</svg>